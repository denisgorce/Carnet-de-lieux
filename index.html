<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Carnet de lieux</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<header id="bar">
  <label class="search">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Rechercher un lieu, un souvenir…" enterkeyhint="search" autocomplete="off" aria-label="Rechercher dans mes lieux">
    <button type="button" id="qx" class="qx" hidden aria-label="Effacer la recherche"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </label>
  <div id="chips" role="group" aria-label="Filtres"></div>
</header>

<main id="listview" hidden><div id="list"></div></main>

<div id="hint" hidden>
  <span class="hi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
  <div><b>Votre carnet est vide</b><small>Ajoutez le premier lieu que vous avez visité.</small></div>
  <button class="b p" id="hintAdd">Ajouter</button>
</div>
<button id="zone" hidden></button>
<button class="fab" id="bLoc" aria-label="Ma position"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
<button class="fab main" id="bAdd" aria-label="Ajouter un lieu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<nav id="nav" aria-label="Navigation">
  <button data-t="map" class="on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Carte</button>
  <button data-t="list"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Liste<b class="bd" id="bd" hidden></b></button>
  <button data-t="explore"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Explorer</button>
  <button data-t="account"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Compte</button>
</nav>

<div id="toast" hidden role="status"></div>
<section id="sheet" aria-live="polite"></section>
<div id="lb" role="dialog" aria-label="Photo">
  <img alt="">
  <button class="lbx" id="lbx" aria-label="Fermer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button class="lbn prev" aria-label="Photo précédente">‹</button><button class="lbn next" aria-label="Photo suivante">›</button>
  <span id="lbc"></span>
</div>
<div id="splash"><svg viewBox="0 0 48 56" aria-hidden="true"><path d="M24 54C24 54 4 36 4 21a20 20 0 0 1 40 0c0 15-20 33-20 33z" fill="#ffc233"/><circle cx="24" cy="21" r="8" fill="#1f4d3a"/></svg><p>Carnet de lieux</p></div>

<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
